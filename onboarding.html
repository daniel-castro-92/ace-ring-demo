:root{
  --plum:#230E2E; --plum-2:#3A1A4B; --violet:#6B21A8; --lilac:#A855F7;
  --cream:#FFFCFA; --blush:#F7C6DC; --mist:#F6EEF9; --ink-2:#5B4C66; --line:#E6D9EE;
  --grad:linear-gradient(135deg,#6B21A8,#A855F7);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',Arial,Helvetica,sans-serif;background:var(--mist);color:var(--plum);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:3px;border-radius:8px}

.top{background:var(--plum);color:#fff;padding:14px 32px;display:flex;align-items:center;gap:24px}
.top h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px;white-space:nowrap}
.top .sub{font-size:13px;color:#CDBBDB}
.stepper{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.sbtn{border:1px solid #5A3A70;background:transparent;color:#E9DDF2;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.sbtn[aria-current="step"]{background:#fff;color:var(--plum);border-color:#fff;font-weight:600}
.sbtn.done{border-color:#A855F7;color:#fff}
.nav2{display:flex;gap:8px}
.nbtn{width:36px;height:36px;border-radius:50%;border:1px solid #5A3A70;background:transparent;color:#fff;cursor:pointer;font-size:16px}
.nbtn:disabled{opacity:.35;cursor:default}

.layout{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:28px 32px 20px;max-width:1500px;margin:0 auto}
.stagecol{min-width:0}
.win{background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 70px -34px rgba(35,14,46,.5);overflow:hidden;height:640px;display:flex;flex-direction:column}
.win-bar{display:flex;align-items:center;gap:10px;background:#F1E8F6;padding:10px 14px;flex:none}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#D5C3E0;display:block}
.addr{flex:1;background:#fff;border-radius:999px;padding:6px 16px;font-size:12.5px;color:var(--ink-2);margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;position:relative;overflow:auto;background:var(--cream)}
.scr{padding:40px 56px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scr h2{font-size:34px;line-height:1.15;letter-spacing:-.9px;font-weight:600;margin:0 0 10px}
.scr p.l{font-size:16px;color:var(--ink-2);margin:0 0 26px;max-width:32em}

.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;font-weight:600;font-size:15px;padding:13px 26px;cursor:pointer;background:var(--plum);color:#fff;box-shadow:0 8px 22px -12px rgba(35,14,46,.7);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--plum);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:30px;letter-spacing:-.6px;margin-bottom:22px}
.logo svg{width:30px;height:30px}

.prog{width:340px;height:10px;border-radius:999px;background:#EADCF3;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s linear}

.checks{display:flex;flex-direction:column;gap:10px;width:380px;margin-bottom:26px;text-align:left}
.ck{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;font-weight:500}
.ck input{width:18px;height:18px;accent-color:#6B21A8}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:2}
.switch i{position:absolute;inset:0;border-radius:999px;background:#D9CBE4;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked + i{background:linear-gradient(135deg,#6B21A8,#A855F7)}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:focus-visible + i{outline:3px solid var(--lilac);outline-offset:3px}
.otherbox{width:100%;max-width:420px;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-family:inherit;font-size:15px;color:var(--plum);resize:none;margin-bottom:18px;background:#fff}
.otherbox:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.ck small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}

.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:11px 20px;font-size:15px;cursor:pointer;color:var(--plum);font-weight:500}
.chip:hover{border-color:var(--violet)}
.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.sub-q{margin:4px 0 12px;font-size:14px;color:var(--ink-2)}
.tog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-2);margin-bottom:24px}
.tog i{width:40px;height:24px;border-radius:999px;background:var(--grad);position:relative;display:block}
.tog i::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}

.searchbox{display:flex;align-items:center;width:560px;max-width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 18px;box-shadow:0 14px 34px -22px rgba(35,14,46,.6);margin-bottom:22px;text-align:left}
.searchbox span{flex:1;font-size:15px;color:var(--plum);min-height:24px}
.searchbox span.ph{color:#9a8aa6}
.searchbox button{width:40px;height:40px;border-radius:12px;border:0;background:var(--plum);color:#fff;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:560px;max-width:100%;text-align:left}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--violet)}
.card b{display:block;font-size:14.5px}
.card span{font-size:12.5px;color:var(--ink-2)}
.nova{display:flex;gap:12px;align-items:flex-start;background:var(--mist);border-radius:16px;padding:14px 18px;margin-bottom:22px;max-width:560px;text-align:left;font-size:15px}
.nova .av{flex:none;width:32px;height:32px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}

.serp{width:100%;max-width:640px;text-align:left}
.ans{background:#fff;border:1.5px solid var(--violet);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 14px 34px -24px rgba(107,33,168,.8)}
.ans h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--violet)}
.ans p{margin:0 0 8px;font-size:14.5px}
.ans .nudge{margin-top:10px;background:var(--mist);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.res{padding:10px 4px;border-bottom:1px solid #F0E8F5}
.res .u{font-size:12px;color:#7d6c8a}
.res .t{font-size:16px;color:var(--violet);font-weight:500}
.res .d{font-size:13px;color:var(--ink-2)}

.split{display:grid;grid-template-columns:1fr 360px;width:100%;flex:1;text-align:left}
.split .pg{padding:24px 28px}
.split .pg .bar{height:10px;border-radius:5px;background:#EFE6F4;margin-top:12px}
.split .pg h3{margin:0 0 4px;font-size:19px}
.win-win{background:#FFFCFA;border-left:1px solid #EFE6EE;color:#2b2230;display:flex;flex-direction:column;overflow:auto}
.win-win .aph{height:48px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #F1E8EF;font-weight:600;font-size:15px;color:var(--plum);flex:none}
.win-win .alogo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6B21A8,#A855F7);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.win-win .chat{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.win-win .ub{align-self:flex-end;max-width:90%;background:#FAEBE2;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:13.5px;color:#2b2230}
.win-win h4{margin:0;font-size:14.5px;font-weight:600;color:var(--plum)}
.t2{width:100%;border-collapse:collapse;font-size:12.5px}
.t2 th{font-weight:500;color:#7d6c8a;text-align:left;padding:6px 4px;border-bottom:1px solid #EFE6EE}
.t2 td{padding:10px 4px;border-bottom:1px solid #F5EEF3;vertical-align:top}
.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;background:#F0E8F5;color:#5B4C66;margin-top:3px}
.tag.warn{background:#FFE6EF;color:#8A2656}
.tag.ok{background:#DDF5E6;color:#1F5A38}
.win-win .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.win-win .btn{background:var(--plum);color:#fff;padding:10px 16px;font-size:13px;box-shadow:none}
.win-win .btn.ghost{background:transparent;color:var(--plum);border-color:var(--line)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--plum);color:#fff;border-radius:14px;padding:12px 20px;font-size:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);animation:fade .3s ease}

.pend{display:inline-block;background:var(--blush);color:var(--plum);border-radius:8px;padding:2px 8px;font-weight:600;font-size:11.5px;margin-left:6px;vertical-align:middle}
.resume{display:flex;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 20px;width:560px;max-width:100%;text-align:left;margin-bottom:14px}
.resume .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center}
.resume .ic svg{width:24px;height:24px}
.resume b{display:block;font-size:15px}
.resume span{font-size:13px;color:var(--ink-2)}
.resume .btn{margin-left:auto;padding:10px 18px;font-size:13px}
.soft{width:560px;max-width:100%;background:var(--mist);border-radius:16px;padding:14px 18px;font-size:13.5px;color:var(--ink-2);text-align:left;margin-top:6px}

.notes{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;height:640px;overflow:auto}
.notes .k{font-size:13px;font-weight:600;color:var(--violet);margin:0 0 4px}
.notes h2{margin:0 0 4px;font-size:24px;letter-spacing:-.5px;font-weight:600}
.notes .goal{margin:0 0 18px;font-size:14.5px;color:var(--ink-2)}
.notes h3{font-size:13px;font-weight:600;color:var(--violet);margin:18px 0 6px}
.notes ul{margin:0;padding-left:18px;font-size:14px}
.notes li{margin:4px 0}
.foot{max-width:1500px;margin:0 auto;padding:0 32px 28px;font-size:12.5px;color:var(--ink-2)}
.foot .pend{margin-left:0;margin-right:6px}

@media (prefers-reduced-motion:reduce){.scr,.toast{animation:none}.prog i{transition:none}}
@media (max-width:1100px){.layout{grid-template-columns:1fr}.notes{height:auto}.top{flex-wrap:wrap}.stepper{margin-left:0}}
</style>
</head>
<body>
<header class="top">
  <h1>Ace onboarding and first use</h1>
  
  <div class="stepper" id="stepper" role="tablist" aria-label="Steps"></div>
  <div class="nav2">
    <button class="nbtn" id="prev" aria-label="Previous step">&#8592;</button>
    <button class="nbtn" id="next" aria-label="Next step">&#8594;</button>
  </div>
</header>

<div class="layout">
  <div class="stagecol">
    <div class="win">
      <div class="win-bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="addr" id="addr">ace.ai</div>
      </div>
      <div class="stage" id="stage"></div>
    </div>
  </div>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>
<div class="foot"><span class="pend">Proposed</span>Marks an idea we would test. It is not in the product today. All retailers and data are fictional samples. Use the arrow keys to move between steps.</div>

<script>
(function(){
  var LOGO='<svg viewBox="0 0 28 28" fill="none"><path d="M3 25 12 3h4l9 22h-4.6l-1.8-4.6H9.4L7.6 25H3Zm8-8.6h5.2L13.6 9.6 11 16.4Z" fill="#230E2E"/><circle cx="23" cy="6" r="3" fill="#A855F7"/></svg>';
  var QUERY='lab grown vs natural diamond engagement ring';
  var state={intent:'A big purchase',sub:'Engagement ring'};

  var steps=[
   {name:'Install',addr:'ace.ai',
    title:'Install',goal:'Get from ad click to a running browser with the fewest moments to doubt.',
    seen:['The landing page promise carries over, so the download page repeats it','One clear button, then a short installer with visible progress','Ace opens by itself when the install ends'],
    measure:['Landing page visit to download started','Download to first open','Time from click to first open'],
    risk:['People leave while the installer runs. Fix: show progress and say what happens next, and open Ace automatically.'],
    render:function(el,go){
      el.innerHTML='<div class="logo">'+LOGO+'ace</div><h2>The helpful browser</h2><p class="l">Where tabs become answers. Free for Windows and Mac.</p><div id="inst"><button class="btn" id="get">Get Ace</button></div>';
      el.querySelector('#get').onclick=function(){
        var box=el.querySelector('#inst');
        box.innerHTML='<div class="prog"><i id="bar"></i></div><p class="l" id="pm" style="margin:0">Installing Ace. This takes about a minute.</p>';
        var w=0,t=setInterval(function(){w+=12;var b=el.querySelector('#bar');if(!b){clearInterval(t);return}b.style.width=Math.min(w,100)+'%';
          if(w>=100){clearInterval(t);var pm=el.querySelector('#pm');if(pm){pm.textContent='Done. Opening Ace.'}setTimeout(function(){if(cur===0)go(1)},700)}},260);
      };
    }},
   {name:'Import',addr:'ace://welcome/import',
    title:'Import from Chrome',goal:'Make Ace feel like home in one tap, so nothing is lost by switching.',
    seen:['One toggle, on by default: import and sync with Chrome','No list of data types to read or decide on','Skip stays available, but is quiet'],
    measure:['Import started rate','Import completed rate','Share who leave the toggle on'],
    risk:['Worry about leaving Chrome. Fix: one line saying Chrome stays exactly as it is.'],
    render:function(el,go){
      el.innerHTML='<h2>Bring your Chrome with you</h2><p class="l">Chrome stays exactly as it is.</p>'+
      '<label class="ck" style="width:380px;margin-bottom:26px;justify-content:space-between"><span>Import and sync with Chrome<small>Pick up right where you left off</small></span><span class="switch"><input type="checkbox" id="sync" checked><i></i></span></label>'+
      '<button class="btn" id="imp">Continue</button>';
      el.querySelector('#imp').onclick=function(){go(2)};
    }},
   {name:'Make it yours',addr:'ace://welcome/setup',
    title:'Make it yours',goal:'Learn the user’s intent in one tap, so the first screen can speak to it.',
    seen:['One question: what brings you to Ace today','The ad intent can arrive preselected, so ring shoppers skip the question *','Default browser is a clear, optional switch'],
    measure:['Intent answered rate','Share that arrive with an intent from the ad','Default browser set rate','Free text from Other, a signal for the next intents to build'],
    risk:['Setup fatigue. Fix: two taps maximum, and every step has a visible way to continue.'],
    render:function(el,go){
      el.innerHTML='<h2>What brings you to Ace today?</h2><p class="l">Pick one. You can change it any time.</p>'+
      '<div class="chips" id="c1"></div><div id="sub"></div>'+
      '<div class="tog"><i aria-hidden="true"></i>Make Ace my default browser</div><button class="btn" id="go3">Continue</button>';
      var opts=['A big purchase','Plan a trip','Work and study','Just exploring','Other'];
      var c1=el.querySelector('#c1');
      opts.forEach(function(o){var b=document.createElement('button');b.className='chip';b.textContent=o;b.setAttribute('aria-pressed',String(o===state.intent));
        b.onclick=function(){state.intent=o;[].forEach.call(c1.children,function(x){x.setAttribute('aria-pressed',String(x===b))});drawSub()};c1.appendChild(b)});
      function drawSub(){
        var s=el.querySelector('#sub');
        if(state.intent==='A big purchase'){
          s.innerHTML='<p class="sub-q">What are you shopping for?</p><div class="chips" id="c2"></div>';
          var c2=s.querySelector('#c2');['Engagement ring','Mattress','E-bike','Sofa'].forEach(function(o){var b=document.createElement('button');b.className='chip';b.textContent=o;b.setAttribute('aria-pressed',String(o===state.sub));
            b.onclick=function(){state.sub=o;[].forEach.call(c2.children,function(x){x.setAttribute('aria-pressed',String(x===b))})};c2.appendChild(b)});
        } else if(state.intent==='Other'){
          s.innerHTML='<p class="sub-q">Tell us what you want to do with Ace</p><textarea class="otherbox" id="otherTxt" rows="2" maxlength="140" placeholder="For example, plan a wedding, learn a language"></textarea>';
          var tx=s.querySelector('#otherTxt');tx.value=state.other||'';tx.oninput=function(){state.other=tx.value};tx.focus();
        } else {s.innerHTML=''}
      }
      drawSub();
      el.querySelector('#go3').onclick=function(){go(3)};
    }},
   {name:'Welcome',addr:'ace://newtab',
    title:'First new tab',goal:'Turn the stated intent into a first action within seconds.',
    seen:['A short greeting that uses the intent the person chose','Four starter actions written as outcomes, not features','A normal search box, so nothing feels locked in'],
    measure:['Starter card click rate','Time from first open to first action','Share who type a search instead'],
    risk:['A blank or generic screen. Fix: starter cards change with the intent.'],
    render:function(el,go){
      var ring=state.sub==='Engagement ring'||state.intent!=='A big purchase';
      var item=state.intent==='A big purchase'?state.sub.toLowerCase():'what you are working on';
      el.innerHTML='<div class="nova"><div class="av">N</div><div>Hi, I’m Nova. Let’s sort out your '+item+'. Open a few tabs and I’ll line them up for you.</div></div>'+
      '<div class="searchbox"><span class="ph">Search or ask Ace</span><button aria-label="Search">&#10148;</button></div>'+
      '<div class="cards">'+
      card('Compare the rings I opened','One table, every tab')+
      card('Explain lab grown vs natural','Short and fair')+
      card('Read the reviews for me','Spot what repeats')+
      card('Try a ring on her hand','Ace try-on preview')+
      '</div>';
      [].forEach.call(el.querySelectorAll('.card'),function(c){c.onclick=function(){go(4)}});
      el.querySelector('.searchbox button').onclick=function(){go(4)};
      function card(a,b){return '<div class="card" tabindex="0" role="button"><b>'+a+'</b><span>'+b+'</span></div>'}
    }},
   {name:'First search',addr:'ace://search?q=lab+grown+vs+natural',
    title:'First search',goal:'Give a useful answer before the first click on a result.',
    seen:['The question the person asked in the ad is answered at the top','Ace suggests the next small step: open a few rings and I will compare them','Normal results stay below, unchanged'],
    measure:['Answer card engagement','Share who open a second and third ring tab','Time to the first compare request'],
    risk:['Answers that feel generic. Fix: keep it short, fair and specific to the decision.'],
    render:function(el,go){
      el.innerHTML='<div class="serp"><div class="searchbox" style="width:100%"><span id="q"></span><button aria-label="Search">&#10148;</button></div><div id="out"></div></div>';
      var q=el.querySelector('#q'),i=0;
      var t=setInterval(function(){if(!el.querySelector('#q')){clearInterval(t);return}q.textContent=QUERY.slice(0,++i);if(i>=QUERY.length){clearInterval(t);setTimeout(show,250)}},32);
      function show(){
        var o=el.querySelector('#out');if(!o)return;
        o.innerHTML='<div class="ans"><h3>Nova</h3><p>Both are real diamonds. Lab grown stones are made in a lab and are often priced lower. Natural stones are mined. Either way, look for an independent certificate.</p>'+
        '<div class="nudge"><span>Open the rings you like and I’ll compare them for you.</span><button class="btn" id="open3" style="padding:9px 16px;font-size:13px">Open 3 sample rings</button></div></div>'+
        res('haldenandrose.example','Oval solitaire, 1.5 ct lab grown','A classic setting in 14k gold')+
        res('marlowegems.example','Round brilliant, 1.0 ct natural','Certificate included')+
        res('oaklinejewelers.example','Oval engagement ring, lab grown','Free resizing')+
        res('veyadiamonds.example','Cushion cut, 1.2 ct natural','30 day returns');
        o.querySelector('#open3').onclick=function(){go(5)};
      }
      function res(u,t,d){return '<div class="res"><div class="u">'+u+'</div><div class="t">'+t+'</div><div class="d">'+d+'</div></div>'}
    }},
   {name:'First win',addr:'ace://compare',
    title:'The first win',goal:'Deliver the moment the person feels clearer than before. This is the activation event.',
    seen:['Ace reads the open tabs and builds one comparison table','It flags what is missing, such as a certificate, instead of ranking winners','Clear next actions: save the shortlist or see a ring on her hand'],
    measure:['Time from install to first compare','Share who reach this screen','Shortlist saved rate'],
    risk:['The table feels like homework. Fix: fill it for them, and keep the flags short.'],
    render:function(el,go){
      el.style.padding='0';el.style.alignItems='stretch';el.style.justifyContent='stretch';el.style.textAlign='left';
      el.innerHTML='<div class="split"><div class="pg"><h3>Halden &amp; Rose, Oval 1.5 ct</h3><div style="font-size:13px;color:#5B4C66">Lab grown, 14k yellow gold</div><div class="bar" style="width:90%"></div><div class="bar" style="width:68%"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:55%"></div></div>'+
      '<div class="win-win"><div class="aph"><div class="alogo">A</div>Ace</div><div class="chat"><div class="ub">Compare the 4 rings I opened</div><h4>Here is how your 4 rings compare</h4>'+
      '<table class="t2"><thead><tr><th>Jeweler</th><th>Stone</th><th>Price</th></tr></thead><tbody>'+
      '<tr><td>Halden &amp; Rose<br><span class="tag ok">Certificate listed</span></td><td>Lab, 1.5 ct</td><td>$3,200</td></tr>'+
      '<tr><td>Marlowe Gems<br><span class="tag ok">Certificate listed</span></td><td>Natural, 1.0 ct</td><td>$6,900</td></tr>'+
      '<tr><td>Oakline Jewelers<br><span class="tag warn">No certificate shown</span></td><td>Lab, 1.5 ct</td><td>$2,850</td></tr>'+
      '<tr><td>Veya Diamonds<br><span class="tag">30 day returns</span></td><td>Natural, 1.2 ct</td><td>$7,400</td></tr></tbody></table>'+
      '<div class="acts"><button class="btn" id="save">Save shortlist</button><button class="btn ghost" id="try">See on her hand</button></div></div></div></div>';
      el.querySelector('#save').onclick=function(){toast(el,'Shortlist saved. Find it on your new tab.')};
      el.querySelector('#try').onclick=function(){toast(el,'Add a photo to see an Ace try-on preview.')};
    }},
   {name:'Come back',addr:'ace://newtab',
    title:'Day 2 and beyond',goal:'Give a reason to return, and let value lead to the next purchase.',
    seen:['The new tab picks up where the person left off','After the decision, Ace suggests the next steps in the same journey *','The try-on limit and Premium appear softly, after value, never before *'],
    measure:['Day 1, day 7 and day 30 return','Second intent started','Free to Premium conversion, after the first win'],
    risk:['The need ends once the ring is bought. Fix: carry the person to the next decision, such as the proposal and the wedding.'],
    render:function(el,go){
      el.innerHTML='<h2>Welcome back</h2><p class="l">Pick up where you left off.</p>'+
      '<div class="resume"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div><div><b>Ring shortlist</b><span>4 rings compared yesterday</span></div><button class="btn">Open</button></div>'+
      '<div class="resume"><div class="ic" style="background:#F7C6DC"><svg viewBox="0 0 24 24" fill="none" stroke="#230E2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg></div><div><b>Plan the proposal<span class="pend">Proposed</span></b><span>Venues, a photographer, a weekend</span></div><button class="btn ghost">Start</button></div>'+
      '<div class="soft">You have used 1 of 3 free try-on previews this month. Premium gives you more. <span class="pend">Proposed</span></div>';
    }}
  ];

  var cur=0,stage=document.getElementById('stage'),notes=document.getElementById('notes'),addr=document.getElementById('addr');
  var stepper=document.getElementById('stepper'),prev=document.getElementById('prev'),next=document.getElementById('next');

  steps.forEach(function(s,i){var b=document.createElement('button');b.className='sbtn';b.textContent=(i+1)+'. '+s.name;b.onclick=function(){go(i)};stepper.appendChild(b)});

  function toast(el,t){var old=document.querySelector('.toast');if(old)old.remove();var d=document.createElement('div');d.className='toast';d.textContent=t;document.getElementById('stage').appendChild(d);setTimeout(function(){d.remove()},2600)}

  function go(i){
    if(i<0||i>=steps.length)return;
    cur=i;var s=steps[i];
    stage.innerHTML='';var el=document.createElement('div');el.className='scr';stage.appendChild(el);
    addr.textContent=s.addr;
    s.render(el,go);
    stage.scrollTop=0;
    notes.innerHTML='<p class="k">Step '+(i+1)+' of '+steps.length+'</p><h2>'+s.title+'</h2><p class="goal">'+s.goal+'</p>'+
      '<h3>What the user sees</h3><ul>'+s.seen.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'+
      '<h3>What we measure</h3><ul>'+s.measure.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'+
      '<h3>Where we could lose people</h3><ul>'+s.risk.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
    [].forEach.call(stepper.children,function(b,j){
      if(j===i){b.setAttribute('aria-current','step')}else{b.removeAttribute('aria-current')}
      b.classList.toggle('done',j<i);
    });
    prev.disabled=i===0;next.disabled=i===steps.length-1;
  }
  prev.onclick=function(){go(cur-1)};next.onclick=function(){go(cur+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')go(cur+1);
    if(e.key==='ArrowLeft')go(cur-1);
  });
  var start=parseInt((location.hash||'').replace('#',''),10);
  go(isNaN(start)?0:Math.max(0,Math.min(steps.length-1,start-1)));
})();
</script>
</body>
</html>
